<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aula 3º ESO"><meta name="theme-color" content="#F2F4F8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%232F6FDE%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EA%3C/text%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%232F6FDE%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EA%3C/text%3E%3C/svg%3E"></head><body>
<title>Aula 3º ESO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#F2F4F8; --paper:#FFFFFF; --ink:#1E2833; --ink2:#4B5866; --line:#D8DEE7; --soft:#E8ECF3;
  --mat:#2F6FDE; --mat-s:#E3ECFC; --geo:#1F8A6A; --geo-s:#DDF3EA; --bio:#C2497D; --bio-s:#FBE3EE; --fyq:#D9741E; --fyq-s:#FDEBD9; --tec:#6B5BD2; --tec-s:#E9E5FA;
  --ok:#1C8A5A; --ok-s:#DDF4E8; --bad:#C43A3A; --bad-s:#FBE1E1; --warn:#B7791F; --warn-s:#FDF1D6;
  --num:#2F6FDE; --den:#C2497D; --focus:#2F6FDE;
  --accent:var(--mat); --accent-s:var(--mat-s);
  --radius:18px; --shadow:0 2px 12px rgba(30,40,51,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151A21; --paper:#1E252E; --ink:#EDF0F4; --ink2:#AEB8C4; --line:#33404D; --soft:#28313C;
    --mat:#6FA0F5; --mat-s:#1F2F4A; --geo:#4FBF9A; --geo-s:#1B3A31; --bio:#E77CAB; --bio-s:#402233; --fyq:#F09A4E; --fyq-s:#43301C; --tec:#A497F0; --tec-s:#2E2950;
    --ok:#4FC98A; --ok-s:#1B3A2C; --bad:#F07A7A; --bad-s:#432222; --warn:#E5B04C; --warn-s:#3E3219;
    --num:#8FB6FF; --den:#F59CC2; --focus:#8FB6FF; --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151A21; --paper:#1E252E; --ink:#EDF0F4; --ink2:#AEB8C4; --line:#33404D; --soft:#28313C;
  --mat:#6FA0F5; --mat-s:#1F2F4A; --geo:#4FBF9A; --geo-s:#1B3A31; --bio:#E77CAB; --bio-s:#402233; --fyq:#F09A4E; --fyq-s:#43301C; --tec:#A497F0; --tec-s:#2E2950;
  --ok:#4FC98A; --ok-s:#1B3A2C; --bad:#F07A7A; --bad-s:#432222; --warn:#E5B04C; --warn-s:#3E3219;
  --num:#8FB6FF; --den:#F59CC2; --focus:#8FB6FF; --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.75;letter-spacing:.012em;-webkit-font-smoothing:antialiased}
body.font-alt{font-family:"Atkinson Hyperlegible","Lexend",system-ui,sans-serif}
body.big{font-size:21px}
button{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 60px;padding-inline:16px}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 .9em;max-width:62ch}
ul,ol{max-width:62ch;padding-left:1.3em;margin:0 0 .9em}
li{margin-bottom:.35em}
strong{font-weight:600;color:var(--accent)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);font-weight:600}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;background:none;border:0;padding:6px 10px 6px 0;cursor:pointer}
.brand .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--mat),var(--bio))}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-s);border-color:var(--accent);color:var(--ink)}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.subject{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;cursor:pointer;border-top:6px solid var(--sc);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-height:140px}
.subject:hover{transform:translateY(-2px)}
.subject .name{font-weight:700;font-size:1.15rem}
.subject .tema{color:var(--ink2);font-size:.95rem}
.subject .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:auto}
.subject .bar i{display:block;height:100%;background:var(--sc);width:0}
.today{border-left:6px solid var(--warn);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.today .t{font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.hidden{display:none!important}
/* topic view */
.topic-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.lessons{display:grid;gap:10px;margin-top:16px}
.lesson{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;cursor:pointer}
.lesson .n{width:40px;height:40px;border-radius:12px;background:var(--accent-s);color:var(--accent);font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.lesson .t{font-weight:600}
.lesson .m{color:var(--ink2);font-size:.9rem}
.lesson .done{color:var(--ok);font-weight:700;font-size:.9rem}
.lesson.task{border-color:var(--warn);background:var(--warn-s)}
.lesson.task .n{background:var(--paper);color:var(--warn)}
/* lesson player */
.player{display:grid;gap:14px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--soft)}
.progress i.on{background:var(--accent)}
.progress i.cur{background:var(--accent);opacity:.55}
.step{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
.step h2{margin-bottom:14px}
.step .body{font-size:1.06em}
.callout{border-radius:14px;padding:12px 16px;margin:14px 0;background:var(--accent-s);border-left:5px solid var(--accent);max-width:62ch}
.callout.warn{background:var(--warn-s);border-color:var(--warn)}
.callout.ok{background:var(--ok-s);border-color:var(--ok)}
.callout .lab{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
/* barras de fracción */
.bars{display:grid;gap:8px;margin:12px 0;max-width:520px}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .lab{min-width:70px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:flex;flex:1;height:34px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.bar i{flex:1;border-right:2px solid var(--ink);background:var(--paper)}
.bar i:last-child{border-right:0}
.bar i.f{background:var(--num)}
.bar i.g{background:var(--den)}
.bar.thin{height:22px}
.say{display:inline-flex;align-items:center;gap:8px;background:var(--warn-s);border-left:5px solid var(--warn);border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:500}
.recall{display:grid;gap:10px}
.recall details{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--paper)}
.recall summary{cursor:pointer;font-weight:600}
.recall details p{margin:8px 0 0}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-variant-numeric:tabular-nums;font-weight:600}
.fr .n{color:var(--num);padding:0 5px;border-bottom:2.5px solid var(--ink)}
.fr .d{color:var(--den);padding:0 5px}
.fr-wrap{display:inline-flex;align-items:center;gap:2px}
.math{font-size:1.15em;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:10px 0;font-variant-numeric:tabular-nums}
.op{padding:0 4px;font-weight:600}
.eq{display:flex;flex-direction:column;gap:14px;margin:12px 0}
.eqstep{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:14px;background:var(--soft)}
.eqstep .k{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.eqstep .why{color:var(--ink2);font-size:.95rem;margin-bottom:4px}
.eqstep.locked{opacity:.35;filter:blur(1px)}
.reveal{margin-top:6px}
/* quiz */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .l{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-s)}
.opt.wrong{border-color:var(--bad);background:var(--bad-s)}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 16px;margin-top:8px}
.feedback.good{background:var(--ok-s);border-left:5px solid var(--ok)}
.feedback.badf{background:var(--bad-s);border-left:5px solid var(--bad)}
.answerbox{margin-top:10px}
.answerbox input{font:inherit;font-size:1.05rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:min(100%,260px)}
/* timer */
.timer{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;font-size:.95rem}
.ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,0%),var(--soft) 0);display:grid;place-items:center}
.ring::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--paper)}
.break{position:fixed;inset:0;background:rgba(20,26,33,.55);display:grid;place-items:center;padding:16px;z-index:50}
.break .card{max-width:420px;text-align:center}
.speak{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-size:.92rem}
.speak.on{background:var(--accent-s);border-color:var(--accent)}
.kbd{font-size:.8rem;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.98em}
.tbl th,.tbl td{border:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:600}
.tblwrap{overflow-x:auto}
.levels{display:grid;gap:8px;margin:12px 0}
.level{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--soft)}
.level b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:.85rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:600;background:var(--accent-s);color:var(--accent)}
.scale{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.scale span{padding:6px 10px;border-radius:10px;background:var(--soft);font-size:.9rem;font-variant-numeric:tabular-nums}
.scale span.hi{background:var(--accent-s);font-weight:700}
.end{ text-align:center;padding:30px 20px}
.end .big{font-size:2.4rem}
textarea{font:inherit;width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);padding:10px 12px;background:var(--paper);color:var(--ink);resize:vertical}
.small{font-size:.9rem;color:var(--ink2)}
@media (max-width:520px){ .step{padding:20px 18px} h1{font-size:1.6rem} body{font-size:17px} .lesson{grid-template-columns:40px 1fr} .lesson .done{grid-column:2} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap" id="app"></div>

<script src="util.js"></script>
<script src="mat.js"></script>
<script src="geo-bio.js"></script>
<script src="fyq-tec.js"></script>
<script src="app.js"></script>

</body></html>
